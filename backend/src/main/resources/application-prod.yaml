spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}

server:
  address: 0.0.0.0
  port: ${PORT:8000}

jwt:
  secret: ${JWT_SECRET}
